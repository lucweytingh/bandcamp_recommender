[project]
name = "bandcamp-recommender"
version = "0.4.0"
description = "Bandcamp recommendation engine based on supporter purchases, with per-track feature vectors for similarity matching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "selenium>=4.39.0",
    "webdriver-manager>=4.0.2",
    "blinker<1.8",
]

[project.optional-dependencies]
# Pull in numpy + an MP3 decoder for BPM detection (both backends decode via
# librosa.load). Install with: `uv sync --extra bpm`.
bpm = [
    "numpy>=1.24",
    "librosa>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bandcamp_recommender"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

